<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extainium</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Popup only. Titanium shows it full screen on the phone; desktop Chrome sizes it from min-inline-size. */
  body.pop { min-inline-size: 320px; background: var(--bg); }
  .pop main {
    max-inline-size: 480px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px;
    padding-block: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-bottom));
    /* Physical sides: safe-area insets are physical. */
    padding-left: max(var(--pad), env(safe-area-inset-left, 0px));
    padding-right: max(var(--pad), env(safe-area-inset-right, 0px));
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
  .brand img { inline-size: 24px; block-size: 24px; flex: none; }

  .hero { display: flex; align-items: flex-start; gap: 12px; min-inline-size: 0; }
  .hero > div { display: grid; gap: 4px; min-inline-size: 0; flex: 1; }
  .hero h1 { overflow-wrap: break-word; }
  .hero .meta { font-variant-numeric: tabular-nums; }
  .glyph {
    flex: none; inline-size: 44px; block-size: 44px; border-radius: var(--r-full);
    display: none; place-items: center; background: var(--surface-2); color: var(--muted);
  }
  .glyph svg { inline-size: 24px; block-size: 24px; stroke-width: 2.5; }
  .glyph svg + svg { display: none; }
  [data-state="update"] .glyph { display: grid; background: var(--accent-tint); color: var(--accent); }
  [data-state="current"] .glyph { display: grid; background: var(--ok-tint); color: var(--ok); }
  [data-state="current"] .glyph svg:first-child { display: none; }
  [data-state="current"] .glyph svg:nth-child(2) { display: block; }
  [data-state="attention"] .glyph { display: grid; background: var(--warn-tint); color: var(--warn); }
  [data-state="attention"] .glyph svg { display: none; }
  [data-state="attention"] .glyph svg:last-child { display: block; }

  .rows {
    list-style: none; margin: 0; padding: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-card); overflow: clip;
  }
  .rows:empty { display: none; }
  .rows li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-inline-size: 0; }
  .rows li + li { border-block-start: 1px solid var(--line); }
  .avatar { position: relative; flex: none; inline-size: 48px; block-size: 48px; }
  .avatar .owner, .avatar .fallback {
    inline-size: 48px; block-size: 48px; border-radius: var(--r-md); display: block;
  }
  .avatar .owner { background: var(--surface-2); object-fit: cover; outline: 1px solid var(--img-outline); outline-offset: -1px; }
  .avatar .fallback {
    background: var(--accent-tint); color: var(--accent); font-weight: 600; font-size: var(--fs-lg);
    display: grid; place-items: center; text-transform: uppercase;
  }
  .avatar .fallback[hidden] { display: none; }
  .avatar .ext {
    position: absolute; inset-inline-end: -4px; inset-block-end: -4px;
    inline-size: 24px; block-size: 24px; border-radius: var(--r-sm);
    background: var(--surface); padding: 2px; box-shadow: 0 0 0 1px var(--line);
  }
  .row-text { display: grid; gap: 2px; min-inline-size: 0; flex: 1; }
  .row-text strong { line-height: 1.3; overflow-wrap: break-word; }
  .versions-line { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .versions-line .to { color: var(--accent); font-weight: 600; }
  .versions-line.attention { color: var(--warn); font-weight: 600; }

  .pop .hint { color: var(--muted); }
  .error-box { background: var(--err-tint); border-radius: var(--r-md); padding: 12px; display: grid; gap: 4px; }
  .error-box strong { font-size: var(--fs-base); }
  .error-box .detail { font-size: var(--fs-xs); color: var(--muted); }
  /* Empty: stays in the accessibility tree as a live region, out of the grid. */
  .error-box:empty { position: absolute; padding: 0; }

  .pop .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .pop .actions > button { flex: 1 1 140px; }
  #check[aria-busy="true"]::before {
    content: ""; inline-size: 16px; block-size: 16px; border: 2px solid currentColor;
    border-inline-end-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { #check[aria-busy="true"]::before { animation-duration: 2.4s; } }
</style>
</head>
<body class="pop" data-state="loading">
<main>
  <div class="brand"><img src="icons/icon-32.png" alt="" width="24" height="24">Extainium</div>
  <div class="hero">
    <span class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 6v8M12 18.5v.01"/></svg>
    </span>
    <div>
      <h1 id="summary" aria-live="polite">Extainium</h1>
      <p id="lastCheck" class="meta"></p>
    </div>
  </div>
  <p id="emptyHint" class="hint" hidden>Track a GitHub repository in Extainium to see its updates here.</p>
  <ul id="updates" class="rows" aria-label="Updates and items to review"></ul>
  <div id="error" class="error error-box" role="alert"></div>
  <div class="actions">
    <button id="check">Check all</button>
    <button id="open" class="primary">Open Extainium</button>
  </div>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
